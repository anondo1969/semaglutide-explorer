name: Test and publish Docker image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate files and tests
        run: |
          python scripts/preflight.py --strict
          python -m pip install -r requirements-dev.txt
          python -m pytest -q
      - name: Set immutable GHCR image name and tag
        id: names
        shell: bash
        run: |
          repository="$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          stamp="$(date -u +'%Y%m%dT%H%M%SZ')"
          sha="${GITHUB_SHA:0:7}"
          tag="${stamp}-${sha}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "image=ghcr.io/${repository}:${tag}" >> "$GITHUB_OUTPUT"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push reproducible linux/amd64 image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ steps.names.outputs.image }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=Aggregate semaglutide dispensing statistics explorer
